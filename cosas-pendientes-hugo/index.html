<title>Privado</title>
<style>
:root{--bg:#f6f4ef;--card:#fffdf8;--ink:#1f2a24;--muted:#6b756f;--line:#e4e0d6;--accent:#1f8a4c;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#121815;--card:#1a221e;--ink:#e6ece8;--muted:#93a39a;--line:#2a3530;--accent:#4fc283;--err:#f97066}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
h1{font-size:1.1rem;margin:0 0 14px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:.9rem;min-height:1.4em;margin:10px 0 0}
</style>

const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: bytes(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(PAYLOAD.iv) }, key, bytes(PAYLOAD.ct));
  return new TextDecoder().decode(plain);
}

document.getElementById('unlock').addEventListener('submit', async ev => {
  ev.preventDefault();
  const button = document.getElementById('open');
  const error = document.getElementById('error');
  button.disabled = true;
  error.textContent = '';
  let html;
  try {
    html = await decrypt(document.getElementById('password').value);
  } catch (_) {
    error.textContent = 'Contraseña incorrecta.';
    button.disabled = false;
    return;
  }
  document.open();
  document.write(html);
  document.close();
});
</script>
